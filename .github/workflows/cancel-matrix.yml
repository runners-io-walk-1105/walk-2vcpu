# Throwaway, RUN-4479's live check: "Cancel run (N jobs)" on the run page cancels every unfinished job.
# Manual only, so no fork or push can start a job. Three jobs that wait, so there is something to cancel.
name: cancel-matrix
on:
  workflow_dispatch:
jobs:
  wait:
    strategy:
      matrix:
        n: [1, 2, 3]
    runs-on: runnersio-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - run: echo "RUN-4479 job ${{ matrix.n }} on $(hostname)"; sleep 600

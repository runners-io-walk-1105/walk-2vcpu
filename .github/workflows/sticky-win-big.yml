# RUN-4455 live check (Grant approved 2026-11-19 ~17:35Z, directly): EXACTLY one Windows job and one 32 vCPU job on
# paid burst, for a sticky-disk test organisation. Each must run with no disk and not be refused.
# Manual only. Each job is a few seconds of echo. Remove this file after the run.
name: sticky windows + 32 vCPU (RUN-4455)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: runnersio-4vcpu-windows-2025
    timeout-minutes: 15
    steps:
      - run: echo "windows ok"
  big:
    runs-on: runnersio-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - run: nproc; echo "32 vcpu ok"
